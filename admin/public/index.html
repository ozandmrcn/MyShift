<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyShift — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0b0f17; --panel:#121826; --panel2:#0f1626; --line:#1e293b;
    --txt:#e2e8f0; --dim:#64748b; --accent:#38bdf8; --green:#34d399; --red:#f87171; --amber:#fbbf24;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; letter-spacing:.3px; }
  header .sub { color:var(--dim); font-size:12px; }
  .spacer { flex:1; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#04121f; font-weight:600; border-color:transparent; }
  button.danger:hover { border-color:var(--red); color:var(--red); }
  select, input, textarea { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  input, textarea { width:100%; }
  textarea { font-family:ui-monospace,Consolas,monospace; font-size:12px; min-height:140px; resize:vertical; }
  main { padding:20px; display:grid; grid-template-columns: minmax(320px, 1fr) minmax(520px, 2fr); gap:20px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .panel h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card .v { font-size:20px; font-weight:700; }
  .card .k { color:var(--dim); font-size:11px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { color:var(--dim); text-align:left; font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid #16213a; vertical-align:top; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:#141d31; }
  .pill { display:inline-block; background:#172238; color:var(--dim); border-radius:999px; padding:1px 8px; font-size:11px; margin-left:6px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); }
  .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .meta-grid > .panel:nth-child(3) { grid-column:1/-1; }
  .error { color:var(--red); background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.3); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:13px; }
  .ok { color:var(--green); }
  .dim { color:var(--dim); }
  .row { display:flex; gap:6px; align-items:center; }
  .row button { padding:4px 9px; font-size:12px; }
  .json-view { white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#a5b4fc; background:#0a0f1c; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:340px; overflow:auto; }
  .hidden { display:none !important; }
  .chart-box { position:relative; height:240px; margin-top:12px; }
  #detail { grid-column:1/-1; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:10; }
  #modal-inner { width:min(680px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .muted2 { color:var(--amber); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🛠 MyShift — Admin Panel</h1>
  <span class="sub" id="proj-label"></span>
  <div class="spacer"></div>
  <select id="project-select" class="hidden"><option value="">—</option></select>
  <button id="btn-refresh">🔄 Yenile</button>
  <button id="btn-export-all">📦 Tümünü Dışa Aktar</button>
</header>

<main>
  <section class="panel" style="grid-column:1/-1" id="config-error"></section>

  <section class="panel">
    <h2>Genel İstatistik</h2>
    <div class="cards" id="stat-cards"></div>
    <div class="chart-box"><canvas id="chart-global"></canvas></div>
  </section>

  <section class="panel">
    <h2>Kullanıcılar <span class="pill" id="user-count"></span></h2>
    <table>
      <thead><tr><th>UID</th><th>Gün</th><th>Çalışma</th><th>Boş</th><th>Mola</th><th>Tamam</th><th>Şablon</th></tr></thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </section>

  <section class="panel hidden" id="detail">
    <h2>Detay — <span id="detail-uid"></span></h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="panel">
        <h2>Meta (settings / templates / completedShifts)</h2>
        <div class="tabs">
          <button class="active" data-meta="settings">Ayarlar</button>
          <button data-meta="templates">Şablonlar</button>
          <button data-meta="completedShifts">Tamamlananlar</button>
        </div>
        <textarea id="meta-editor" spellcheck="false"></textarea>
        <div class="row" style="margin-top:8px; justify-content:flex-end;">
          <span class="dim muted2" id="meta-status"></span>
          <button class="primary" id="btn-save-meta">💾 Meta'yı Kaydet</button>
        </div>
      </div>
      <div class="panel">
        <h2>Günlük Kayıtlar</h2>
        <table>
          <thead><tr><th>Tarih</th><th>Çalışma</th><th>Boş</th><th>Mola×</th><th>Tamam</th><th></th></tr></thead>
          <tbody id="days-tbody"></tbody>
        </table>
        <div class="row" style="margin-top:8px; justify-content:flex-end;">
          <button class="primary" id="btn-add-day">➕ Yeni Gün</button>
          <button id="btn-export-user">📦 Kullanıcıyı Dışa Aktar</button>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:14px;">
      <h2>Kullanıcı Grafiği — çalışma (bar) / boş (çizgi) saatler</h2>
      <div class="chart-box"><canvas id="chart-user"></canvas></div>
    </div>
  </section>
</main>

<div id="modal" class="hidden">
  <div id="modal-inner">
    <div class="row" style="margin-bottom:12px;">
      <label style="color:var(--dim); font-size:12px;">Tarih (YYYY-MM-DD)</label>
      <input id="day-date" style="width:130px;" />
      <span class="spacer"></span>
      <button id="btn-modal-close">✕ Kapat</button>
    </div>
    <textarea id="day-json" spellcheck="false" style="min-height:320px;"></textarea>
    <div class="row" style="margin-top:10px; justify-content:flex-end;">
      <span class="dim muted2" id="day-status"></span>
      <button class="danger" id="btn-day-delete">🗑 Sil</button>
      <button class="primary" id="btn-day-save">💾 Kaydet</button>
    </div>
  </div>
</div>

<script>
const fmtH = (sec) => sec == null ? '—' : `${(sec / 3600).toFixed(1)} s`;
const fmtClock = (t) => t ? new Date(t).toLocaleString('tr-TR') : '—';
const $ = (s) => document.querySelector(s);

let pid = '';
let users = [];
let currentUser = null; // { uid, meta, days }
let currentMetaTab = 'settings';
let charts = { global: null, user: null };

async function api(url, opts) {
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(`${url}${sep}pid=${encodeURIComponent(pid || '__')}`, {
    headers: opts && opts.body ? { 'Content-Type': 'application/json' } : undefined,
    method: opts?.method || 'GET',
    body: opts?.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ── yükleme ───────────────────────────────────────────────────────────────
async function boot() {
  const status = await fetch('/api/status').then(r => r.json()).catch(() => ({ ok: false, projects: [] }));
  const sel = $('#project-select');
  const cfgErr = $('#config-error');
  if (!status.ok || status.projects.length === 0) {
    cfgErr.innerHTML = '⚠️ <b>Firestore yapılandırılmadı.</b> Root <code>.env</code> içine ekleyin:<br><code>FIREBASE_ADMIN_SERVICE_ACCOUNT=C:\\yol\\serviceAccountKey.json</code><br>(Google Cloud IAM → Hizmet Hesapları → Anahtar üret). Sonra sunucuyu yeniden başlatın.';
    return;
  }
  const ready = status.projects.filter(p => p.ready);
  for (const p of ready) {
    const opt = document.createElement('option');
    opt.value = p.projectId;
    opt.textContent = `${p.label} — ${p.projectId}`;
    sel.appendChild(opt);
  }
  for (const p of status.projects) {
    if (!p.ready) cfgErr.innerHTML += `⚠️ ${p.label}: ${p.error}<br>`;
  }
  if (cfgErr.innerHTML === '') cfgErr.classList.add('hidden');
  sel.classList.remove('hidden');
  sel.onchange = () => { pid = sel.value; loadAll(); };
  pid = sel.value || ready[0].projectId;
  sel.value = pid;
  $('#proj-label').textContent = status.projects.find(p => p.projectId === pid)?.label || pid;
  await loadAll();
}

async function loadAll() {
  $('#proj-label').textContent = pid;
  const [u, st] = await Promise.all([api('/api/users'), api('/api/stats')]);
  users = u.users;
  renderStats(st);
  renderUsers();
  if (currentUser) selectUser(currentUser.uid);
}

// ── istatistik ─────────────────────────────────────────────────────────────
function renderStats(st) {
  const cards = $('#stat-cards');
  const days = st.series;
  const totalWorked = days.reduce((a, d) => a + d.worked, 0);
  const totalIdle = days.reduce((a, d) => a + d.idle, 0);
  const totalBreak = days.reduce((a, d) => a + d.break, 0);
  const done = days.reduce((a, d) => a + d.completed, 0);
  cards.innerHTML = `
    <div class="card"><div class="v">${users.length}</div><div class="k">Kullanıcı</div></div>
    <div class="card"><div class="v">${days.length}</div><div class="k">Kayıtlı Gün</div></div>
    <div class="card"><div class="v">${fmtH(totalWorked)}</div><div class="k">Toplam Çalışma</div></div>
    <div class="card"><div class="v">${fmtH(totalIdle)}</div><div class="k">Toplam Boş</div></div>
    <div class="card"><div class="v">${fmtH(totalBreak)}</div><div class="k">Toplam Mola</div></div>
    <div class="card"><div class="v">${done}</div><div class="k">Tamamlanan Gün</div></div>`;
  renderChart('chart-global', 'global', days.slice(-60));
}

function renderChart(id, which, days) {
  const labels = days.map(d => d.date);
  const workedH = days.map(d => +(d.worked / 3600).toFixed(2));
  const idleH = days.map(d => +(d.idle / 3600).toFixed(2));
  const ctx = document.getElementById(id);
  if (charts[which]) charts[which].destroy();
  charts[which] = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Çalışma (saat)', data: workedH, backgroundColor: 'rgba(56,189,248,.55)', yAxisID: 'y' },
        { type: 'line', label: 'Boş (saat)', data: idleH, borderColor: '#fbbf24', backgroundColor: 'transparent', yAxisID: 'y', tension: .3 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { labels: { color: '#94a3b8' } } } }
  });
}

// ── kullanıcı listesi ──────────────────────────────────────────────────────
function renderUsers() {
  $('#user-count').textContent = users.length;
  $('#users-tbody').innerHTML = users.map(u => `
    <tr class="clickable" data-uid="${u.uid}">
      <td class="dim" style="font-family:monospace">${u.uid}</td>
      <td>${u.daysCount}</td>
      <td>${fmtH(u.totalWorked)}</td>
      <td>${fmtH(u.totalIdle)}</td>
      <td>${fmtH(u.totalBreak)}</td>
      <td>${u.completedShifts}<span class="pill">${u.templates} şablon</span></td>
      <td>${u.settingsKeys > 0 ? '✅' : ''}</td>
    </tr>`).join('');
  document.querySelectorAll('#users-tbody tr').forEach(tr => {
    tr.onclick = () => selectUser(tr.dataset.uid);
  });
}

async function selectUser(uid) {
  $('#detail-uid').textContent = uid;
  const data = await api(`/api/users/${uid}`);
  currentUser = data;
  $('#detail').classList.remove('hidden');
  renderMetaTab();
  renderDays();
  renderUserChart();
}

// ── meta editör ────────────────────────────────────────────────────────────
function metaValue(tab) {
  const meta = currentUser.meta || {};
  return JSON.stringify(meta[tab] ?? null, null, 2);
}
function renderMetaTab() {
  $('#meta-editor').value = metaValue(currentMetaTab);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.meta === currentMetaTab));
}
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => { currentMetaTab = b.dataset.meta; renderMetaTab(); };
});

$('#btn-save-meta').addEventListener('click', async () => {
  const meta = currentUser.meta || {};
  try {
    const parsed = JSON.parse($('#meta-editor').value);
    meta[currentMetaTab] = parsed;
    await api(`/api/users/${currentUser.uid}/meta`, { method: 'PUT', body: meta });
    $('#meta-status').textContent = `✅ kaydedildi ${new Date().toLocaleTimeString('tr-TR')}`;
    currentUser.meta = meta;
  } catch (e) {
    $('#meta-status').textContent = `❌ ${e.message}`;
  }
});

// ── gün kayıtları ──────────────────────────────────────────────────────────
function renderDays() {
  const days = currentUser.days;
  $('#days-tbody').innerHTML = days.map(d => `
    <tr>
      <td style="font-family:monospace">${d.date}</td>
      <td>${fmtH(d.workedSeconds)}</td>
      <td>${fmtH(d.idleSeconds)}</td>
      <td>${fmtH(d.breakSeconds)} ${d.breakCount ? `×${d.breakCount}` : ''}</td>
      <td>${d.completed ? '✅' : ''}</td>
      <td><div class="row"><button data-edit="${d.date}">Düzenle</button><button class="danger" data-del="${d.date}">Sil</button></div></td>
    </tr>`).join('');
  document.querySelectorAll('#days-tbody [data-edit]').forEach(b => b.onclick = () => openDayModal(b.dataset.edit, 1));
  document.querySelectorAll('#days-tbody [data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(`Gün ${b.dataset.del} silinsin mi?`)) return;
    await api(`/api/users/${currentUser.uid}/days/${b.dataset.del}`, { method: 'DELETE' });
    await selectUser(currentUser.uid);
    await loadAll();
  });
}

let modalDate = '';
$('#btn-export-user').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ uid: currentUser.uid, pid, meta: currentUser.meta, days: currentUser.days }, null, 2)], { type: 'application/json' });
  download(blob, `myshift-${currentUser.uid}-${pid}.json`);
});
$('#btn-export-all').addEventListener('click', async () => {
  const data = await api('/api/export');
  download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `myshift-all-${pid}.json`);
});
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function openDayModal(date, add) {
  modalDate = date;
  $('#day-date').value = date;
  $('#day-status').textContent = '';
  const doc = (add && date) ? currentUser.days.find(d => d.date === date) : null;
  if (add) {
    $('#day-json').value = doc ? JSON.stringify(doc, null, 2) : JSON.stringify({ workedSeconds: 0, idleSeconds: 0, breakSeconds: 0, breakCount: 0, completed: false }, null, 2);
    $('#btn-day-delete').style.display = 'none';
  } else {
    $('#day-json').value = JSON.stringify(currentUser.days.find(d => d.date === date), null, 2);
    $('#btn-day-delete').style.display = '';
  }
  $('#modal').classList.remove('hidden');
}
$('#btn-add-day').addEventListener('click', () => {
  const today = new Date().toISOString().slice(0, 10);
  openDayModal(today, 1);
});
$('#btn-day-save').addEventListener('click', async () => {
  const date = $('#day-date').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('#day-status').textContent = '❌ tarih formatı YYYY-MM-DD'; return; }
  let body;
  try { body = JSON.parse($('#day-json').value); } catch (e) { $('#day-status').textContent = `❌ ${e.message}`; return; }
  try {
    await api(`/api/users/${currentUser.uid}/days/${date}`, { method: 'PUT', body });
    $('#day-status').textContent = '✅ kaydedildi';
    await selectUser(currentUser.uid);
    await loadAll();
  } catch (e) { $('#day-status').textContent = `❌ ${e.message}`; }
});
$('#btn-day-delete').addEventListener('click', async () => {
  if (!confirm(`Gün ${modalDate} silinsin mi?`)) return;
  await api(`/api/users/${currentUser.uid}/days/${modalDate}`, { method: 'DELETE' });
  $('#modal').classList.add('hidden');
  await selectUser(currentUser.uid);
  await loadAll();
});
$('#btn-modal-close').addEventListener('click', () => $('#modal').classList.add('hidden'));

function renderUserChart() {
  const days = currentUser.days;
  renderChart('chart-user', 'user', days.slice(-60));
}

$('#btn-refresh').addEventListener('click', () => boot());

boot();
</script>
</body>
</html>
